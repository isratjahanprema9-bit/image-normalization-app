<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RasterLab - Image Normalization</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8 flex flex-col items-center justify-center">

    <h1 class="text-3xl font-bold mb-6 text-blue-400">Welcome to RasterLab</h1>

    <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 w-full max-w-lg text-center">
        <h2 class="text-xl font-semibold mb-4">⚙️ Raster Normalization Engine</h2>

        <form action="/" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div class="border-2 border-dashed border-slate-600 rounded-lg p-6 flex flex-col items-center justify-center hover:border-blue-500 transition">
                
                <!-- Image Preview -->
                <img id="image-preview" class="hidden max-h-48 rounded mb-3" alt="Preview">
                <p id="file-name" class="text-sm text-slate-400 mb-2">Drag & Drop Raster file here</p>

                <label class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded cursor-pointer text-sm">
                    📁 Browse Files
                    <input type="file" name="file" id="file-input" class="hidden" accept="image/*" required onchange="previewFile()">
                </label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg transition">
                🪄 Normalize Raster
            </button>
        </form>

        <!-- Normalized Output Result -->
        {% if result_image %}
        <div class="mt-6 p-4 bg-slate-900 rounded-lg border border-slate-700">
            <h3 class="text-green-400 font-semibold mb-2">✅ Normalized Result:</h3>
            <img src="{{ result_image }}" class="w-full max-h-64 object-contain rounded" alt="Normalized Result">
        </div>
        {% endif %}
    </div>

    <script>
        function previewFile() {
            const input = document.getElementById('file-input');
            const preview = document.getElementById('image-preview');
            const fileName = document.getElementById('file-name');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    fileName.textContent = input.files[0].name;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
